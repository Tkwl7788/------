<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel 키워드 마스터</title>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            padding: 20px;
            background-color: #f4f7f6;
            color: #333;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .section {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #eee;
            border-radius: 8px;
        }

        .flex-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        input {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .input-order {
            width: 350px;
            font-weight: bold;
            color: #007bff;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn-gen {
            background-color: #007bff;
            color: white;
        }

        .btn-save-all {
            background-color: #28a745;
            color: white;
        }

        .btn-save-split {
            background-color: #6f42c1;
            color: white;
        }

        button:hover {
            opacity: 0.8;
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        #result-container {
            margin: 20px 0;
            max-height: 400px;
            overflow-y: auto;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .result-row {
            display: flex;
            align-items: center;
            padding: 8px 15px;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }

        .res-formula {
            font-size: 11px;
            background: #e9ecef;
            padding: 2px 6px;
            border-radius: 4px;
            margin-right: 12px;
            color: #555;
            min-width: 40px;
            text-align: center;
        }

        .table-wrapper {
            max-height: 200px;
            overflow: auto;
            border: 1px solid #eee;
            font-size: 11px;
            margin-top: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #eee;
            padding: 8px;
            text-align: center;
        }

        th {
            background: #f8f9fa;
            position: sticky;
            top: 0;
        }

        .col-idx {
            display: block;
            color: #007bff;
            font-size: 10px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>🚀 키워드 생성기</h2>

        <div class="section">
            <input type="file" id="excel-file" accept=".xlsx, .xls" />
        </div>

        <div class="section">
            <div class="flex-group">
                <label>조합당 생성 개수:</label>
                <input type="number" id="gen-count" style="width: 70px;" value="1" min="1">
                <label>조합식:</label>
                <input type="text" id="col-order" class="input-order" placeholder="예: 12, 34">
                <button id="random-btn" class="btn-gen" disabled>조합 생성</button>
            </div>
        </div>

        <div id="save-section" class="section" style="display: none; background-color: #f0fdf4;">
            <div class="flex-group">
                <input type="text" id="sheet-name" placeholder="결과 시트 이름" style="width: 150px;">
                <button id="save-all-btn" class="btn-save-all">방식 1: A열 일렬 저장</button>
                <button id="save-split-btn" class="btn-save-split">방식 2: 조합별 구분 저장</button>
            </div>
        </div>

        <div id="result-container">
            <div style="padding: 20px; color: #999; text-align: center;">파일 로드 후 생성 버튼을 눌러주세요.</div>
        </div>

        <h4>데이터 미리보기</h4>
        <div class="table-wrapper">
            <table id="output-table">
                <thead id="table-header"></thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </div>

    <script>

        fetch('http://localhost:3000/')
            .then(res => res.text())
            .then(data => console.log(data));
        let columnsData = {};
        let firstSheetData = null;
        let generatedResults = [];

        document.getElementById('excel-file').addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function (e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const rawData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1 });
                firstSheetData = rawData;
                processColumns(rawData);
                displayTable(rawData);
                document.getElementById('random-btn').disabled = false;
            };
            reader.readAsArrayBuffer(file);
        });

        function processColumns(data) {
            columnsData = {};
            const maxCols = Math.max(...data.map(row => row.length));
            for (let col = 0; col < maxCols; col++) {
                columnsData[col + 1] = [];
                for (let row = 1; row < data.length; row++) {
                    const val = data[row][col];
                    if (val !== undefined && val !== null && String(val).trim() !== '') columnsData[col + 1].push(val);
                }
            }
        }

        document.getElementById('random-btn').addEventListener('click', function () {
            const targetCount = parseInt(document.getElementById('gen-count').value) || 1;
            const formulas = document.getElementById('col-order').value.split(',').map(s => s.trim()).filter(s => s);
            if (!formulas.length) return alert("조합식을 입력하세요.");

            const resultContainer = document.getElementById('result-container');
            resultContainer.innerHTML = '';
            generatedResults = [];
            const uniqueSet = new Set();

            // 각 조합식별로 루프를 돌려 정확한 개수 보장
            formulas.forEach(formula => {
                let formulaCreatedCount = 0;
                let attempts = 0;
                const maxAttempts = targetCount * 50;

                while (formulaCreatedCount < targetCount && attempts < maxAttempts) {
                    attempts++;
                    const cols = formula.replace(/[^0-9]/g, '').split('').map(Number);
                    let sentence = cols.map(c => {
                        const items = columnsData[c] || [];
                        return items[Math.floor(Math.random() * items.length)] || '';
                    }).join('').trim();

                    // 문장이 존재하고, 전체 세트에서 고유한 경우만 추가
                    if (sentence && !uniqueSet.has(sentence)) {
                        uniqueSet.add(sentence);
                        generatedResults.push({ formula: formula, text: sentence });
                        formulaCreatedCount++;

                        // 화면 미리보기 (최대 100개까지만 표시)
                        if (generatedResults.length <= 100) {
                            const row = document.createElement('div');
                            row.className = 'result-row';
                            row.innerHTML = `<span class="res-formula">${formula}</span><span>${sentence}</span>`;
                            resultContainer.appendChild(row);
                        }
                    }
                }
            });
            document.getElementById('save-section').style.display = 'block';
        });

        // 방식 1: A열 일렬 저장
        document.getElementById('save-all-btn').addEventListener('click', function () {
            const sName = document.getElementById('sheet-name').value.trim() || "일렬결과";
            const newWb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(newWb, XLSX.utils.aoa_to_sheet(firstSheetData), "원본데이터");

            const aoaData = [[`전체 조합식: ${document.getElementById('col-order').value}`]];
            generatedResults.forEach(item => aoaData.push([item.text]));

            XLSX.utils.book_append_sheet(newWb, XLSX.utils.aoa_to_sheet(aoaData), sName);
            XLSX.writeFile(newWb, "all_results.xlsx");
        });

        // 방식 2: 조합별 열 구분 저장 (정확한 열 배치 로직)
        document.getElementById('save-split-btn').addEventListener('click', function () {
            const sName = document.getElementById('sheet-name').value.trim() || "열구분결과";
            const formulas = document.getElementById('col-order').value.split(',').map(s => s.trim()).filter(s => s);
            const newWb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(newWb, XLSX.utils.aoa_to_sheet(firstSheetData), "원본데이터");

            // 행-열 데이터 구성 (1행은 제목, 2행부터 데이터)
            const targetCount = parseInt(document.getElementById('gen-count').value) || 1;
            const finalTable = Array.from({ length: targetCount + 1 }, () => Array(formulas.length).fill(""));

            formulas.forEach((f, colIdx) => {
                finalTable[0][colIdx] = f; // 헤더 입력
                const filtered = generatedResults.filter(r => r.formula === f);
                filtered.forEach((r, rowIdx) => {
                    if (rowIdx < targetCount) finalTable[rowIdx + 1][colIdx] = r.text;
                });
            });

            XLSX.utils.book_append_sheet(newWb, XLSX.utils.aoa_to_sheet(finalTable), sName);
            XLSX.writeFile(newWb, "column_split_results.xlsx");
        });

        function displayTable(data) {
            const head = document.getElementById('table-header');
            const body = document.getElementById('table-body');
            head.innerHTML = ''; body.innerHTML = '';
            const maxCols = Math.max(...data.map(row => row.length));
            const firstRow = data[0] || [];
            let trHead = document.createElement('tr');
            for (let i = 1; i <= maxCols; i++) {
                const th = document.createElement('th');
                th.innerHTML = `<span class="col-idx">${i}열</span>${firstRow[i - 1] || ""}`;
                trHead.appendChild(th);
            }
            head.appendChild(trHead);
            data.slice(1, 6).forEach(row => {
                const tr = document.createElement('tr');
                for (let i = 0; i < maxCols; i++) {
                    const td = document.createElement('td');
                    td.textContent = row[i] || '';
                    tr.appendChild(td);
                }
                body.appendChild(tr);
            });
        }
    </script>

</body>

</html>
